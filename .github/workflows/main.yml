name: Build SkinSetter

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Checkout DisguiseAPI
        uses: actions/checkout@v5
        with:
          repository: itspinger/DisguiseAPI
          path: DisguiseAPI

      - name: Build DisguiseAPI
        run: mvn -B install -DskipTests --file DisguiseAPI/pom.xml

      - name: Build SkinSetter
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: SkinSetter
          path: target/*.jar
